[pytest]
testpaths = tests
pythonpath = .
markers =
    smoke: teste rapide, critice, rulate la fiecare push
    regression: suita completă, rulată nightly
    api: teste API
    web: teste Selenium
    mobile: teste Appium
    network: simulare de picare a rețelei
    defect(title, severity): metadate pentru bug report-ul generat când testul pică
addopts = -v --alluredir=allure-results
